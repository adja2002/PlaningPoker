<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CAPI</title>
</head>
<body>
<h1>Partie créée</h1>
<p><span th:text="${partie.nombreJoueurs}"></span> joueurs :</p>
<ul>
    <li th:each="joueur : ${partie.joueurs}" th:text="${joueur.pseudo}"></li>
</ul>

<h2>Charger le backlog</h2>
<p th:if="${erreur}" th:text="${erreur}" style="color: red;"></p>
<form action="/backlog" method="post" enctype="multipart/form-data">
    <input type="file" name="fichier" accept=".json" required>
    <button type="submit">Charger</button>
</form>
</body>
</html>
