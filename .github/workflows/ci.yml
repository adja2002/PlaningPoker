
# nom du workflow
name: CI

# lance la CI à chaque push sur main et à chaque pull request vers main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# empêche la CI de modifier le code (mesure de sécurité)
permissions:
  contents: read

# crée un travail nommé test
jobs:
  test:
    runs-on: ubuntu-latest # CI tourne sur Linux fourni par GitHub, pas sur notre PC

    steps:
      # récupère le code du dépôt sur la machine de GitHub
      - uses: actions/checkout@v4

      # installe Java 21 sur la machine de GitHub
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # lance tous les tests avec Maven
      # si un test échoue, la CI devient rouge
      # -B rend l'affichage plus lisible dans les journaux
      - run: mvn -B test
